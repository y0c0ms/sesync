[package]
name = "sesync-team"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.98"
description = "Team sync core: spaces, per-space keys, turn leases, authenticator join, backup policy."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.11"
rand = "0.8"
ring = "0.17"
crypto_box = { version = "0.9", features = ["seal"] }
sha1 = "0.10"
postgres = "0.19"
axum = "0.7"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest = "1"
