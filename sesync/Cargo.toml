[package]
name = "sesync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "sesync daemon (Rust port of daemon/harness_sync.py)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v5"] }
ring = "0.17"
crypto_box = { version = "0.9", features = ["seal"] }
sesync-team = { path = "../sesync-team", version = "0.1.0" }
ratatui = "0.30"
# The width table ratatui itself places glyphs with (already in the lock file through ratatui),
# so the list's columns are cut and padded by the same widths the terminal frame uses.
unicode-width = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
crossterm = "0.29"
sha2 = "0.10"
zstd = "0.14"
ureq = { version = "2", features = ["json"] }
qrcodegen = "1"
# The phone bridge (`sesync bridge`): a WebSocket server on tokio. Only the bridge subcommand runs it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
base64 = "0.22"
# The gitignore-aware walk behind the phone's file search (files.rs). Only that module uses it.
ignore = "0.4"
# Mutexes the bridge holds for one short section each; parking_lot's guards need no poison handling.
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
# The process list "Open in herdr" reads (`proc_tree`): herdr on Windows reports only a pane's
# shell. Already in the lock file through other crates.
# The phone bridge talks to herdr over its named pipe (`bridge::herdr`, `PeekNamedPipe`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes"] }

[dev-dependencies]
proptest = "1"
postgres = "0.19"
# The client end-to-end tests run the real team-server router in-process over a TCP socket.
# axum is already in the lock file through sesync-team.
axum = "0.7"
